services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: japanese_study
      POSTGRES_USER: japanese_study
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japanese_study -d japanese_study"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://japanese_study:${POSTGRES_PASSWORD}@db:5432/japanese_study
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      # Kosong = CORS ditolak semua (default aman; lihat backend/.env.example).
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      CONFIG_KEK: ${CONFIG_KEK:-}
      # Email reset password (Gmail SMTP App Password; kosong = log-only).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_NAME: ${APP_NAME:-Japanese Study}
      RESET_CODE_TTL_MIN: ${RESET_CODE_TTL_MIN:-15}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PGSSL: ${PGSSL:-false}
      PGSSL_REJECT_UNAUTHORIZED: ${PGSSL_REJECT_UNAUTHORIZED:-true}
      PGSSL_CA: ${PGSSL_CA:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    build: ./proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    environment:
      DOMAIN: ${TLS_IP:-192.168.100.11}
    volumes:
      - nginx_certs:/etc/nginx/certs
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  nginx_certs:
